services:
    mongodb:
        image: mongo:latest
        container_name: mongodb
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: password
        volumes:
            - mongodb_data:/data/db
        restart: unless-stopped

    neo4j:
        image: neo4j:5.26
        container_name: neo4j
        ports:
            - '7474:7474'
            - '7687:7687'
        environment:
            NEO4J_AUTH: neo4j/password
        volumes:
            - neo4j_data:/data
            - neo4j_logs:/logs
        restart: unless-stopped

    rag-service:
        build:
            context: .
            dockerfile: rag/Dockerfile
        container_name: rag-service
        env_file:
            - .env
        environment:
            RAG_PORT: 8001
            RAG_STORAGE_DIR: /app/agent/rag/data
            CHROMA_MODE: persistent
            CHROMA_PERSIST_DIR: /app/agent/rag/data/chroma
            NEO4J_URI: bolt://neo4j:7687
            NEO4J_USERNAME: neo4j
            NEO4J_PASSWORD: password
        depends_on:
            - neo4j
        ports:
            - '8001:8001'
        volumes:
            - ./rag:/app/agent/rag
        restart: unless-stopped

volumes:
    mongodb_data:
    neo4j_data:
    neo4j_logs:
