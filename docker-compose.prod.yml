services:
    mongodb:
        image: mongo:latest
        container_name: mongodb
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
        volumes:
            - mongodb_data:/data/db
        restart: unless-stopped
        networks:
            - app-network

    neo4j:
        image: neo4j:5.26
        container_name: neo4j
        environment:
            NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
        volumes:
            - neo4j_data:/data
            - neo4j_logs:/logs
        restart: unless-stopped
        networks:
            - app-network

    chromadb:
        image: chromadb/chroma:latest
        container_name: chromadb
        environment:
            CHROMA_SERVER_AUTHN_CREDENTIALS_FILE: ''
            ANONYMIZED_TELEMETRY: 'false'
        volumes:
            - chroma_data:/chroma/chroma
        restart: unless-stopped
        networks:
            - app-network

    rag-service:
        image: quyensatoru/chatbot-rag-service:latest
        container_name: rag-service
        ports:
            - "8001:8001"
        env_file:
            - .env
        environment:
            RAG_PORT: 8001
            RAG_STORAGE_DIR: /app/agent/rag/data
            CHROMA_MODE: http
            CHROMA_HOST: chromadb
            CHROMA_PORT: 8000
            CHROMA_SSL: 'false'
            NEO4J_URI: bolt://neo4j:7687
            NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
            NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
        depends_on:
            - neo4j
            - chromadb
        volumes:
            - rag_data:/app/agent/rag/data
        restart: unless-stopped
        networks:
            - app-network

    personality:
        image: quyensatoru/chatbot-personality:latest
        container_name: personality-analyzer
        env_file:
            - .env
        volumes:
            - personality_output:/app/personality/output
        profiles:
            - tools
        networks:
            - app-network

    ui:
        image: quyensatoru/chatbot-ui:latest
        container_name: ui
        ports:
            - '8002:8000'
        depends_on:
            - backend
        restart: unless-stopped
        networks:
            - app-network

    backend:
        image: quyensatoru/chatbot-backend:latest
        container_name: backend
        env_file:
            - .env
        environment:
            PORT: 3000
            NODE_ENV: production
            MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/chatbot?authSource=admin
            NEO4J_URI: bolt://neo4j:7687
            NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
            NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
            RAG_SERVICE_URL: http://rag-service:8001
            UPLOAD_DIR: /app/uploads
        depends_on:
            - mongodb
            - neo4j
            - rag-service
        volumes:
            - uploads_data:/app/uploads
            - personality_output:/app/personality/output
        ports:
            - "3005:3000"
        restart: unless-stopped
        networks:
            - app-network


networks:
    app-network:
        driver: bridge

volumes:
    mongodb_data:
    neo4j_data:
    neo4j_logs:
    chroma_data:
    rag_data:
    uploads_data:
    personality_output:
